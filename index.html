<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>児童用時計②</title>
  <meta property="og:title" content="児童用時計②（１年）">
　<meta property="og:description" content="【１年算数なんじなんぷん】児童がクロームブックで模型のように時計の針を指で操作できる学習アプリです。">
　<meta property="og:type" content="website">

  <!-- Google Fonts: 丸みのある数字用フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">

  <!-- PWA & Chromebook Web App 設定 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22%E6%99%82%E8%A8%88%E5%AD%A6%E7%BF%92%E3%83%84%E3%83%BC%E3%83%AB%22%2C%22short_name%22%3A%22%E3%81%A8%E3%81%91%E3%81%84%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23ffffff%22%7D">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* アナログ時計エリア (さらに1.15倍: max-width 1265px) */
    .clock-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1265px;
      padding: 10px;
    }

    .clock-container svg {
      width: 100%;
      height: auto;
      max-height: 92vh;
      touch-action: none;
      cursor: pointer;
      transform: scale(1.15);
      transform-origin: center center;
    }

    /* 右上時刻パネル: 枠の大きさに合わせて大きく文字を表示 */
    .time-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #ffffff;
      border: 3px solid #a2d2ef;
      border-radius: 16px;
      padding: 12px 36px;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 900;
      cursor: pointer;
      min-width: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      z-index: 90;
      white-space: nowrap;
    }

    /* 時刻表示の数字と単位のスタイル */
    .time-num {
      font-weight: 900;
    }

    .time-unit {
      font-size: 0.65em;
      font-weight: 800;
      margin-left: 2px;
    }

    /* 「？」隠しマスク */
    .time-mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: bold;
      color: #333333;
    }

    .time-panel.show .time-mask {
      display: none;
    }

    /* 面取り正方形ボタン共通スタイル */
    .action-btn {
      position: fixed;
      width: 64px;
      height: 64px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      text-align: center;
      line-height: 1.2;
    }

    /* 左下：とめる／はじめる ボタン */
    .btn-left {
      left: 20px;
      bottom: 20px;
      border: 2px solid #548235;
      z-index: 250;
    }

    .btn-stop {
      background-color: #CCFFCC;
      border-color: #548235;
      color: #2e5917;
    }

    /* 「はじめる」ボタンの色を少し薄く設定 */
    .btn-start {
      background-color: #D3E9F5;
      border: 2px solid #a2d2ef;
      color: #1e40af;
    }

    /* 右下：もんだい ボタン */
    .btn-mondai {
      right: 20px;
      bottom: 20px;
      background-color: #FFFFFF;
      border: 2px solid #AED5E9;
      z-index: 100;
    }

    /* 右下：ヒント ボタン */
    .btn-hint {
      right: 20px;
      bottom: 94px;
      background-color: #FFFFFF;
      border: 2px solid #ccc;
      z-index: 100;
    }

    .btn-hint.active {
      border: 2.5px solid #2563EB;
      color: #2563EB;
      background-color: #eff6ff;
    }

    /* 右下：いまの じこく／もどる ボタン */
    .btn-now {
      right: 20px;
      bottom: 168px;
      background-color: #FFFFFF;
      border: 2px solid #ccc;
      z-index: 100;
    }

    .btn-now.active {
      background-color: #FFD9FF;
      border: 2px solid #FF0000;
      color: #FF0000;
    }

    /* 全画面停止画面 */
    .stop-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #CCFFCC;
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .stop-overlay.active {
      display: flex;
    }

    /* メッセージのサイズ調整（0.9倍化） */
    .stop-message {
      color: #548235;
      font-size: clamp(3.15rem, 7.2vw, 5.4rem);
      font-weight: bold;
      text-align: center;
      padding: 0 20px;
    }

    /* 左上：1時間単位表示（目立たない小さな文字） */
    .unit-label {
      position: fixed;
      top: 16px;
      left: 20px;
      font-size: 13px;
      color: #a0a0a0;
      z-index: 90;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 左上：1時間単位表示 -->
  <div class="unit-label">なんじなんぷん</div>

  <!-- 右上：時刻表示パネル -->
  <div class="time-panel" id="timePanel" onclick="toggleTimeMask()">
    <span id="timeText">7じ</span>
    <div class="time-mask" id="timeMask">？</div>
  </div>

  <!-- アナログ時計盤 (SVG) -->
  <div class="clock-container">
    <svg viewBox="0 0 320 320" id="clockSvg">
      <!-- 1. 外枠の水色リング (半径112、太さ7) と白背景 -->
      <circle cx="160" cy="160" r="112" fill="#ffffff" stroke="#a2d2ef" stroke-width="7"/>

      <!-- 2. 時間の範囲を表す黄色扇形 (水色枠線の内側 r=108.5 に収まるように描画) -->
      <path id="sectorPath" fill="#FAE47E" opacity="0.85" d="" />

      <!-- 3. 目盛り線グループ -->
      <g id="clockTicks"></g>

      <!-- 4. 文字盤の数字 -->
      <g font-family="Arial Narrow, sans-serif-condensed, Impact, sans-serif" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a" font-size="28">
        <text x="160" y="72" transform="scale(0.88, 1.2)" transform-origin="160 72">12</text>
        <text x="202" y="83" transform="scale(0.88, 1.2)" transform-origin="202 83">1</text>
        <text x="233" y="114" transform="scale(0.88, 1.2)" transform-origin="233 114">2</text>
        <text x="244" y="160" transform="scale(0.88, 1.2)" transform-origin="244 160">3</text>
        <text x="233" y="206" transform="scale(0.88, 1.2)" transform-origin="233 206">4</text>
        <text x="202" y="237" transform="scale(0.88, 1.2)" transform-origin="202 237">5</text>
        <text x="160" y="248" transform="scale(0.88, 1.2)" transform-origin="160 248">6</text>
        <text x="118" y="237" transform="scale(0.88, 1.2)" transform-origin="118 237">7</text>
        <text x="87" y="206" transform="scale(0.88, 1.2)" transform-origin="87 206">8</text>
        <text x="76" y="160" transform="scale(0.88, 1.2)" transform-origin="76 160">9</text>
        <text x="87" y="114" transform="scale(0.88, 1.2)" transform-origin="87 114">10</text>
        <text x="118" y="83" transform="scale(0.88, 1.2)" transform-origin="118 83">11</text>
      </g>

      <!-- 5. ヒント表示グループ（青色テキスト） -->
      <g id="hintGroup"></g>

      <!-- 6. 短針 (時針) -->
      <polygon id="hourHand" points="153,160 167,160 161,88 159,88" fill="#1a1a1a"/>

      <!-- 7. 長針 (分針) : オレンジ色(#ee6a47) -->
      <polygon id="minuteHand" points="153,160 167,160 161,52 159,52" fill="#ee6a47"/>

      <!-- 8. 中心軸のオレンジリング（0.8倍サイズ） -->
      <circle cx="160" cy="160" r="5.76" fill="#ffffff" stroke="#ee6a47" stroke-width="3.2"/>

      <!-- 9. タッチ操作用エリア -->
      <circle cx="160" cy="160" r="150" fill="#000000" fill-opacity="0" id="clockTouchArea" style="cursor: grab;" />
    </svg>
  </div>

  <!-- 左下：とめる／はじめる ボタン -->
  <button class="action-btn btn-left btn-stop" id="btnLeft" onclick="toggleStopState()">とめる</button>

  <!-- 右下ボタン群 -->
  <button class="action-btn btn-now" id="btnNow" onclick="toggleRealTime()">いまの<br>じこく</button>
  <button class="action-btn btn-hint" id="btnHint" onclick="toggleHint()">ヒント</button>
  <button class="action-btn btn-mondai" id="btnMondai" onclick="generateProblem()">もんだい</button>

  <!-- 全画面「とめる」表示エリア -->
  <div class="stop-overlay" id="stopOverlay">
    <div class="stop-message">よい しせいを しましょう。</div>
  </div>

  <script>
    // グローバル変数の宣言と初期化
    let isStopped = false;
    let isHintActive = false;
    let currentHour = 7;
    let currentMinute = 0;
    let totalMinutes = 7 * 60;
    let realTimeInterval = null;
    let isDragging = false;
    let dragTarget = null;
    let lastRawAngle = 0;

    // 時計の目盛り生成（1〜12数字位置の目盛り線は黒色 #1a1a1a に変更）
    function createClockTicks() {
      const ticksGroup = document.getElementById('clockTicks');
      let html = '';

      for (let i = 0; i < 60; i++) {
        const angle = i * 6;
        const rad = (angle - 90) * (Math.PI / 180);

        if (i % 5 === 0) {
          // 1〜12の数字に対応する目盛り（黒色）
          const x1 = 160 + 101 * Math.cos(rad);
          const y1 = 160 + 101 * Math.sin(rad);
          const x2 = 160 + 107 * Math.cos(rad);
          const y2 = 160 + 107 * Math.sin(rad);
          html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" />`;
        } else {
          // その他の1分ごとの目盛り（水色）
          const x1 = 160 + 103 * Math.cos(rad);
          const y1 = 160 + 103 * Math.sin(rad);
          const x2 = 160 + 107 * Math.cos(rad);
          const y2 = 160 + 107 * Math.sin(rad);
          html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#a2d2ef" stroke-width="1.5" stroke-linecap="round" />`;
        }
      }

      ticksGroup.innerHTML = html;
    }

    // 針の回転位置の設定
    function setHandRotation(handId, angle) {
      const hand = document.getElementById(handId);
      hand.setAttribute('transform', `rotate(${angle}, 160, 160)`);
    }

    // 「？」マスクのトグル
    function toggleTimeMask() {
      const panel = document.getElementById('timePanel');
      panel.classList.toggle('show');
    }

    // 「とめる」「はじめる」切り替え
    function toggleStopState() {
      isStopped = !isStopped;
      const overlay = document.getElementById('stopOverlay');
      const btnLeft = document.getElementById('btnLeft');

      if (isStopped) {
        overlay.classList.add('active');
        btnLeft.textContent = 'はじめる';
        btnLeft.classList.remove('btn-stop');
        btnLeft.classList.add('btn-start');
      } else {
        overlay.classList.remove('active');
        btnLeft.textContent = 'とめる';
        btnLeft.classList.remove('btn-start');
        btnLeft.classList.add('btn-stop');
      }
    }

    // 黄色扇形パスの生成
    function createSectorD(cx, cy, r, startAngleDeg, endAngleDeg) {
      const startRad = startAngleDeg * Math.PI / 180;
      const endRad = endAngleDeg * Math.PI / 180;

      const x1 = cx + r * Math.cos(startRad);
      const y1 = cy + r * Math.sin(startRad);
      const x2 = cx + r * Math.cos(endRad);
      const y2 = cy + r * Math.sin(endRad);

      const largeArcFlag = (endAngleDeg - startAngleDeg) <= 180 ? '0' : '1';

      return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;
    }

    // ヒント描画機能
    function renderHint() {
      const sectorPath = document.getElementById('sectorPath');
      const hintGroup = document.getElementById('hintGroup');

      if (!isHintActive) {
        sectorPath.setAttribute('d', '');
        hintGroup.innerHTML = '';
        return;
      }

      // 1. 黄色扇形の描画 (水色枠線の内側 r=108.5 に収め、枠線と重ならないように調整)
      const hourIndex = (currentHour % 12);
      const startAngle = hourIndex * 30 - 90;
      const endAngle = startAngle + 30;
      sectorPath.setAttribute('d', createSectorD(160, 160, 108.5, startAngle, endAngle));

      let html = '';
      const fontRounded = '"M PLUS Rounded 1c", "Arial Rounded MT Bold", system-ui, sans-serif';

      // 2. 5分刻みの数字 (0, 5, 10, ... 55) を配置 (半径125)
      const radiusBig = 125;
      for (let i = 0; i < 12; i++) {
        const val = i * 5;
        const angle = i * 30 - 90;
        const rad = angle * Math.PI / 180;
        const x = 160 + radiusBig * Math.cos(rad);
        const y = 160 + radiusBig * Math.sin(rad);
        html += `<text x="${x}" y="${y}" fill="#2563EB" font-size="14" font-weight="900" text-anchor="middle" dominant-baseline="central" font-family='${fontRounded}'>${val}</text>`;
      }

      // 3. 1分単位の小数字：現在分針がある10分刻みの区間のみ表示
      // ただし、0, 5, 10, 15... などのきりのいい数字（5の倍数）の時刻のときは小数字を表示しない
      if (currentMinute % 5 !== 0) {
        const decadeIndex = Math.floor(currentMinute / 10);
        const startMinute = decadeIndex * 10;
        const endMinute = startMinute + 10;

        const radiusSmall = 118;
        for (let m = startMinute + 1; m < endMinute; m++) {
          if (m % 5 === 0) continue; // きりのいい数字のときは非表示

          const angle = (m % 60) * 6 - 90;
          const rad = angle * Math.PI / 180;
          const x = 160 + radiusSmall * Math.cos(rad);
          const y = 160 + radiusSmall * Math.sin(rad);

          html += `<text x="${x}" y="${y}" fill="#2563EB" font-size="6.5" font-weight="900" text-anchor="middle" dominant-baseline="central" font-family='${fontRounded}'>${m % 60}</text>`;
        }
      }

      hintGroup.innerHTML = html;
    }

    // ヒントボタン切り替え
    function toggleHint() {
      isHintActive = !isHintActive;
      const btnHint = document.getElementById('btnHint');
      if (isHintActive) {
        btnHint.classList.add('active');
      } else {
        btnHint.classList.remove('active');
      }
      renderHint();
    }

    // 時計全体の表示更新
    function updateClockDisplay() {
      const minAngle = (totalMinutes % 60) * 6;
      const hourAngle = ((totalMinutes / 60) % 12) * 30;

      setHandRotation('hourHand', hourAngle);
      setHandRotation('minuteHand', minAngle);

      // 12:00付近の丸め誤差防止（11:59.9等で11時0分になる現象の修正）
      let normalizedTotal = Math.round(totalMinutes);
      while (normalizedTotal < 0) normalizedTotal += 12 * 60;
      normalizedTotal = normalizedTotal % (12 * 60);

      let displayHour = Math.floor(normalizedTotal / 60) % 12;
      if (displayHour === 0) displayHour = 12;
      let displayMin = normalizedTotal % 60;

      currentHour = displayHour;
      currentMinute = displayMin;

      // 文字列の更新（数字を目立たせ、「じ」「ふん／ぷん」を小さく表記し、間に半角スペースを挿入）
      let timeHtml = `<span class="time-num">${currentHour}</span><span class="time-unit">じ</span>`;
      if (currentMinute !== 0) {
        const lastDigit = currentMinute % 10;
        const minuteUnit = [1, 3, 6, 8, 0].includes(lastDigit) ? 'ぷん' : 'ふん';
        timeHtml += ` <span class="time-num">${currentMinute}</span><span class="time-unit">${minuteUnit}</span>`;
      }
      document.getElementById('timeText').innerHTML = timeHtml;

      // ヒント描画更新
      renderHint();
    }

    // 現在時刻への設定
    function updateToCurrentTime() {
      const now = new Date();
      let hours = now.getHours() % 12;
      if (hours === 0) hours = 12;
      const minutes = now.getMinutes();

      currentHour = hours;
      currentMinute = minutes;
      totalMinutes = (currentHour % 12) * 60 + currentMinute;

      updateClockDisplay();
    }

    // 「いまの じこく」切り替え（？マスクで隠す）
    function toggleRealTime() {
      const btnNow = document.getElementById('btnNow');

      if (!realTimeInterval) {
        updateToCurrentTime();
        realTimeInterval = setInterval(updateToCurrentTime, 1000);
        btnNow.innerHTML = 'もどる';
        btnNow.classList.add('active');
        // 「？」マスクで非表示にする
        document.getElementById('timePanel').classList.remove('show');
      } else {
        stopRealTime();
        generateProblem();
      }
    }

    function stopRealTime() {
      if (realTimeInterval) {
        clearInterval(realTimeInterval);
        realTimeInterval = null;
        const btnNow = document.getElementById('btnNow');
        btnNow.innerHTML = 'いまの<br>じこく';
        btnNow.classList.remove('active');
      }
    }

    // ランダム問題の作成（1分単位）
    function generateProblem() {
      stopRealTime();

      currentHour = Math.floor(Math.random() * 12) + 1;
      currentMinute = Math.floor(Math.random() * 60);
      totalMinutes = (currentHour % 12) * 60 + currentMinute;

      updateClockDisplay();

      // マスクで隠す
      document.getElementById('timePanel').classList.remove('show');
    }

    // 初期設定（9:03にセット）
    function setInitialTime() {
      stopRealTime();

      currentHour = 9;
      currentMinute = 3;
      totalMinutes = 9 * 60 + 3;

      updateClockDisplay();

      // マスクで隠す
      document.getElementById('timePanel').classList.remove('show');
    }

    // ドラッグおよびタッチ操作の定義
    function setupClockDragEvents() {
      const touchArea = document.getElementById('clockTouchArea');
      const clockSvg = document.getElementById('clockSvg');

      function getSvgCoordinates(e) {
        const pt = clockSvg.createSVGPoint();
        const touch = e.touches && e.touches.length > 0 
          ? e.touches[0] 
          : (e.changedTouches && e.changedTouches.length > 0 ? e.changedTouches[0] : e);
        pt.x = touch.clientX;
        pt.y = touch.clientY;
        const ctm = clockSvg.getScreenCTM();
        if (!ctm) return { x: 0, y: 0 };
        const transformed = pt.matrixTransform(ctm.inverse());
        return { x: transformed.x - 160, y: transformed.y - 160 };
      }

      function handleDragStart(e) {
        if (e.type === 'touchstart' && e.cancelable) {
          e.preventDefault();
        }
        isDragging = true;
        touchArea.style.cursor = 'grabbing';

        // 「いまのじこく」モードのときに針を操作すると、自動で「もどる」モードにする
        if (realTimeInterval) {
          stopRealTime();
        }

        // 針を動かし始めたら時刻表示を「？」マスクで隠す
        document.getElementById('timePanel').classList.remove('show');

        const pt = getSvgCoordinates(e);
        let deg = Math.atan2(pt.y, pt.x) * (180 / Math.PI) + 90;
        if (deg < 0) deg += 360;

        lastRawAngle = deg;
      }

      function handleDragMove(e) {
        if (!isDragging) return;
        if (e.type === 'touchmove' && e.cancelable) {
          e.preventDefault();
        }

        const pt = getSvgCoordinates(e);
        let deg = Math.atan2(pt.y, pt.x) * (180 / Math.PI) + 90;
        if (deg < 0) deg += 360;

        let deltaDeg = deg - lastRawAngle;
        if (deltaDeg < -180) deltaDeg += 360;
        if (deltaDeg > 180) deltaDeg -= 360;

        totalMinutes += deltaDeg / 6;

        while (totalMinutes < 0) totalMinutes += 12 * 60;
        while (totalMinutes >= 12 * 60) totalMinutes -= 12 * 60;

        updateClockDisplay();
        lastRawAngle = deg;
      }

      function handleDragEnd() {
        if (!isDragging) return;
        isDragging = false;
        touchArea.style.cursor = 'grab';

        totalMinutes = Math.round(totalMinutes);
        while (totalMinutes < 0) totalMinutes += 12 * 60;
        while (totalMinutes >= 12 * 60) totalMinutes -= 12 * 60;

        updateClockDisplay();
      }

      touchArea.addEventListener('mousedown', handleDragStart);
      window.addEventListener('mousemove', handleDragMove);
      window.addEventListener('mouseup', handleDragEnd);

      touchArea.addEventListener('touchstart', handleDragStart, { passive: false });
      window.addEventListener('touchmove', handleDragMove, { passive: false });
      window.addEventListener('touchend', handleDragEnd);
    }

    // 起動処理
    window.onload = function() {
      createClockTicks();
      setupClockDragEvents();
      setInitialTime();
    };
  </script>
</body>
</html>
